name: Deploy to Hostinger Web (8888)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Ular Tangga Nusantara client
        working-directory: cahaya-game
        run: |
          npm install
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go-app/go.mod

      - name: Build Linux binary
        working-directory: go-app
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.buildSHA=${SHA}" -o keuangan-linux-amd64 .

      - name: Install deploy dependencies
        run: npm install ssh2 --no-save --prefix deploy/hostinger-web

      - name: Check deploy secrets
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD || secrets.HOSTINGER_SSH_PASSWORD }}
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: |
          if [ -n "$SSH_PASSWORD" ]; then
            echo "mode=ssh"
            echo "DEPLOY_MODE=ssh" >> "$GITHUB_ENV"
          elif [ -n "$HOSTINGER_API_TOKEN" ]; then
            echo "mode=api"
            echo "DEPLOY_MODE=api" >> "$GITHUB_ENV"
          else
            echo "::error::Isi GitHub secret SSH_PASSWORD atau HOSTINGER_API_TOKEN (hPanel → Token API)."
            exit 1
          fi

      - name: Deploy via SSH
        if: env.DEPLOY_MODE == 'ssh'
        working-directory: deploy/hostinger-web
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD || secrets.HOSTINGER_SSH_PASSWORD }}
          SKIP_BINARY_REBUILD: "1"
          BUILD_SHA: ${{ github.sha }}
        run: node deploy-node.mjs

      - name: Deploy via Hostinger API
        if: env.DEPLOY_MODE == 'api'
        working-directory: deploy/hostinger-web
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          SKIP_BINARY_REBUILD: "1"
          BUILD_SHA: ${{ github.sha }}
        run: node deploy-api.mjs

      - name: Verify production build
        run: |
          sleep 8
          BODY=$(curl -sf --max-time 30 "https://sakubijak.com:8888/health" || true)
          echo "health: $BODY"
          echo "$BODY" | grep -q '"status":"ok"' || echo "::warning::Health check failed or port 8888 unreachable from GitHub runner"
